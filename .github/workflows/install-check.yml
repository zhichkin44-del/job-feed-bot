name: install-check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  install-check:
    name: install and test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['20', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Sample run (no network, no keys)
        run: npm run sample
      - name: Tests
        run: npm test
